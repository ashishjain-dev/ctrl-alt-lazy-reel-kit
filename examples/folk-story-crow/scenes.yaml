# A narrated folk story, every picture drawn for this video by two small custom files:
#   dadi.py        the storyteller (a custom character: moods + lip sync like the built-ins)
#   crow_scene.py  the story pictures (a custom element)
# Both follow the Fish-Scale Folk style guide (docs/style-guides.md). Render:
#   reelkit stills examples/folk-story-crow/scenes.yaml -o stills/f
#   reelkit render examples/folk-story-crow/scenes.yaml -o crow.mp4
meta: {title: "thirsty-crow", fps: 30}
style: fish-scale-folk
audio:
  music: {mood: chill, volume: 0.4}
  # tts: {provider: elevenlabs, voices: {dadi: "<voice id>"}}

characters:
  dadi: {file: dadi.py}

cover:
  headline: "The *thirsty* crow"
  sub: "a story from Dadi"
  character: {who: dadi, mood: happy, x: 760, y: 1640, scale: 0.75}

scenes:
  - name: arrive
    elements:
      - {type: custom, file: crow_scene.py, args: {phase: arrive, dur: 5.5}}
    cast:
      - {who: dadi, x: 540, y: 1262, scale: 0.56, mood: happy}
    dialogue:
      - {who: dadi, voice: d1, text: "On a hot day, a *thirsty* crow found a pot. But the water was too low."}

  - name: pebbles
    elements:
      - {type: custom, file: crow_scene.py, args: {phase: pebbles, dur: 6.5}}
    cast:
      - {who: dadi, x: 540, y: 1262, scale: 0.56, mood: think}
    dialogue:
      - {who: dadi, voice: d2, text: "So he dropped in pebbles, one by one, and the water *rose*."}
    tail: 2.0

  - name: drink
    elements:
      - {type: custom, file: crow_scene.py, args: {phase: drink, dur: 4.5}}
    cast:
      - {who: dadi, x: 540, y: 1262, scale: 0.56, mood: smug}
    dialogue:
      - {who: dadi, voice: d3, text: "He drank, and flew away happy.", mood: happy}

  - name: moral
    dur: 4.0
    elements:
      - {type: custom, file: crow_scene.py, args: {phase: fly, dur: 4.0}}
      - {type: sticker, text: "Think, then try again", at: 0.6, x: 540, y: 1330, angle: -4}
    cast:
      - {who: dadi, x: 540, y: 1262, scale: 0.56, mood: happy}
