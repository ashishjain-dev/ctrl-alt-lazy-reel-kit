[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reelkit"
version = "0.1.0"
description = "9:16 short-form videos (reels, shorts, skits) from a YAML script. Pillow + numpy + ffmpeg."
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["pillow>=10", "numpy>=1.24", "pyyaml>=6"]

[project.scripts]
reelkit = "reelkit.__main__:main"

[tool.setuptools]
packages = ["reelkit"]
